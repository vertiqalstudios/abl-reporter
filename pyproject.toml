[project]
name = "abl-reporter"
version = "0.03.0"
description = "Asset-Backed Lending (ABL) collateral evaluation and borrowing base engine."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "reportlab>=4.0.0",
    "scipy>=1.10.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
