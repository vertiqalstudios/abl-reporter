[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abl-reporter"
version = "0.1.17"
description = "Asset-backed lending collateral monitoring and Borrowing Base Certificate reporting"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ["dependencies"]

[project.scripts]
abl-report = "abl.__main__:main"

[tool.setuptools]
packages = ["abl"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
